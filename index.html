<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Wi-Fi</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 40px 15px;
}

.container {
  max-width: 420px;
  margin: auto;
}

.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  text-align: center;
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 25px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 4px;
}

.network {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
}

.password-box {
  background: #f2f2f2;
  border-radius: 10px;
  padding: 18px 10px;
  margin: 10px 0 15px;
}

.password {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
}

button {
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.note {
  font-size: 12px;
  color: #666;
  margin-top: 18px;
  line-height: 1.4;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="title">📶 Event Wi-Fi</div>

    <div class="label">Network Name</div>
    <div class="network">TheClubHotSpot</div>

    <div class="label">Password</div>
    <div class="password-box">
      <div class="password" id="pwd">Loading…</div>
    </div>

    <button onclick="copyPassword()">Copy Password</button>

    <div class="note">
      Wi-Fi password changes daily.<br>
      Valid from 5 Feb to 15 Feb.
    </div>

  </div>
</div>

<script>
const passwords = {
  "0205": "05022026",
  "0206": "06022026",
  "0207": "07022026",
  "0208": "08022026",
  "0209": "09022026",
  "0210": "10022026",
  "0211": "11022026",
  "0212": "12022026",
  "0213": "13022026",
  "0214": "14022026",
  "0215": "15022026"
};

const d = new Date();
const key =
  String(d.getMonth() + 1).padStart(2, "0") +
  String(d.getDate()).padStart(2, "0");

const pwd = passwords[key];

document.getElementById("pwd").innerText =
  pwd ? pwd : "Not available today";

function copyPassword() {
  navigator.clipboard.writeText(
    document.getElementById("pwd").innerText
  );
  alert("Wi-Fi password copied");
}
</script>

</body>
</html>
